name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request stops its older run. Runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Xcode that the README asks for. The macos-26 image has it.
  XCODE: /Applications/Xcode_26.5.app
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  ACTIONLINT_VERSION: v1.7.12

jobs:
  # Which jobs a pull request needs, from the files it changes. A job that its
  # `if` skips counts as passed for a required check. A push to main, or a diff
  # that this job cannot read, runs every job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.paths.outputs.core }}
      app: ${{ steps.paths.outputs.app }}
      full: ${{ steps.paths.outputs.full }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          all() {
            printf 'core=true\napp=true\nfull=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ -n "$PR" ] || all
          # The API gives each path as it is, and both paths of a rename.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)') || all
          core=false app=false full=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/ci.yml) core=true app=true full=true ;;
              contract/*) core=true app=true ;;
              scripts/build-ghosttykit.sh | ghostty.pin) core=true full=true ;;
              # The core tests run the scripts.
              core/* | scripts/*) core=true ;;
              # build-icon.sh reads app/Resources.
              app/Resources/*) core=true app=true full=true ;;
              app/*) app=true full=true ;;
              # The app tests read the design docs.
              docs/*) app=true ;;
            esac
          done <<< "$files"
          printf 'core=%s\napp=%s\nfull=%s\n' "$core" "$app" "$full" | tee -a "$GITHUB_OUTPUT"

  # Loam runs on macOS only, and some core tests skip on other systems.
  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go.mod sets the lowest Go. Releases build with the latest Go, so the tests do too.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: core/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt changes these files. Run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: core
      - run: go test ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...

  # The LoamKit tests. Without GhosttyKit, the package builds no terminal and no driver.
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select -s "$XCODE"
      - run: swift test

  # The app with GhosttyKit: the terminal, the driver and the driver tests build,
  # but do not run. The driver scenarios need focus and menus that the hosted
  # runners do not give reliably, so they stay a local check (TAS-57).
  app-full:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select -s "$XCODE"
      - id: ghosttykit
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Loam/ghosttykit
          key: ghosttykit-${{ hashFiles('ghostty.pin', 'scripts/build-ghosttykit.sh') }}
      - name: Install the Metal Toolchain
        if: steps.ghosttykit.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain
      # With a cache hit, the script only links app/vendor to the cache.
      - run: scripts/build-ghosttykit.sh
      - if: steps.ghosttykit.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Loam/ghosttykit
          key: ${{ steps.ghosttykit.outputs.cache-primary-key }}
      - name: swift build
        working-directory: app
        run: swift build --build-tests --manifest-cache none

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # The image has shellcheck. actionlint runs it on the run steps too.
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
