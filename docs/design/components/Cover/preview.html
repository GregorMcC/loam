<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@500&family=Hanken+Grotesk:wght@400&display=swap">
<style>
  html, body { margin: 0; background: var(--horizon-a); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--horizon-a); }
  svg { position: absolute; inset: 0; }
  .moss { fill: var(--moss); }
  .seam { fill: var(--needs-you); }
  .clay { fill: var(--ink); }
  .pebble { fill: var(--horizon-a); }
  .name { position: absolute; left: 40px; bottom: 64px; margin: 0; font: 500 120px/.92 var(--font-display); letter-spacing: -0.04em; color: var(--ink); }
  .tag { position: absolute; left: 44px; bottom: 32px; max-width: 420px; margin: 0; font: 400 14px/20px var(--font-ui); color: var(--ink-muted); }
</style>
<div class="cover">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <!--
      blocks: moss 480x72 (A horizon), needs-you 480x12 (iron seam), ink 480x200 bleeding off the bottom (clay over bedrock)
      arrangement: a soil profile, strata stacked flush from x=480 with space-1 (4px) gaps, square corners (radius-xs scale floor)
      pattern: discs (pebbles) cut out of the clay in the ground colour; the literal motif row, because Loam is soil and its surfaces are horizons
      scales: gaps space-1; disc radii radius-xs 3, radius-sm 6, radius-md 10, radius-lg 14; 34 units, 8px clear between them
    -->
    <rect class="moss" x="480" y="20" width="480" height="72"/>
    <rect class="seam" x="480" y="96" width="480" height="12"/>
    <rect class="clay" x="480" y="112" width="480" height="200"/>
